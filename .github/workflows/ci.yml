name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure make
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          make bootstrap

      - name: Check Lint
        run: make check-lint

      - name: Check Compile
        run: make check-compile

      - name: Check Docs
        run: make check-docs

      - name: Test
        run: make test

      - name: Smoke
        run: make smoke
