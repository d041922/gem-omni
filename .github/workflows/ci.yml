name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure make
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          make bootstrap

      - name: Quality Gate (single path)
        run: |
          make check
          make test
          make smoke
