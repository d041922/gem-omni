hooks:
  # 1. Prevent modification of production files without confirmation
  - event: PreToolUse
    matcher: tool=Edit file_path=main.py
    script: |
      echo "Warning: Attempting to modify main.py!"
      echo "This is a critical production file."
      echo "Please ensure you have a backup before proceeding."
      # Note: Exit 1 would block the operation
      # For now, just warning
      exit 0

  # 2. Python syntax check after file write
  - event: PostToolUse
    matcher: tool=Write file_path=*.py
    script: |
      python -m py_compile "{file_path}"
      if [ $? -ne 0 ]; then
        echo "Syntax error detected in {file_path}!"
        echo "Please fix the syntax errors."
      fi

  # 3. Detect dangerous keywords in user prompts
  - event: UserPromptSubmit
    matcher: prompt=.*(delete all|remove all|전체.*삭제).*
    script: |
      echo "Warning: Dangerous operation detected!"
      echo "Please be careful when performing bulk operations."
      exit 0
